[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "Capability-aware LinkedIn MCP scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp<2",
  "httpx>=0.27,<1",
]

[project.scripts]
linkedin-mcp = "linkedin_mcp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkedin_mcp = ["tool_catalog.json", "endpoint_manifest.json"]
