[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-mcp-full"
version = "0.1.0"
description = "Capability-aware LinkedIn MCP server: OAuth, posts, comments, reactions, media upload, and ad campaigns."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oliver Hruby" }]
requires-python = ">=3.10"
keywords = ["mcp", "linkedin", "oauth", "ads", "marketing", "ai", "agent", "social"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pip-audit",
    "pytest",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/oliverhruby/linkedin-mcp"
Repository = "https://github.com/oliverhruby/linkedin-mcp"
Issues = "https://github.com/oliverhruby/linkedin-mcp/issues"

[project.scripts]
linkedin-mcp-full = "linkedin_mcp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkedin_mcp = ["tool_catalog.json", "endpoint_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: live LinkedIn API calls; requires LINKEDIN_ACCESS_TOKEN and the relevant OAuth scopes",
]
asyncio_mode = "auto"