name: Coverage Drift

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  coverage-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package (with current dependency resolution)
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Check tool catalog + endpoint manifest coverage drift
        run: python scripts/check_coverage.py