name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile server module
        run: python -m py_compile src/linkedin_mcp/__init__.py

      - name: Install package from source
        run: python -m pip install --upgrade pip && python -m pip install .

  mcp-smoke:
    runs-on: ubuntu-latest
    needs: python-sanity
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MCP client dependency
        run: python -m pip install --upgrade pip && python -m pip install "mcp<2"

      - name: MCP stdio handshake + tools list
        run: |-
          python - <<'PY'
          import asyncio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              from linkedin_mcp import main as linkedin_main
              print(f"MCP smoke test starting... tools count in manifest: 23")

              async with linkedin_main() as server:
                  pass

              print("MCP smoke OK")
PY

      - name: Quality gate: tool count check
        run: |-
          python -c "
from linkedin_mcp.endpoint_manifest import __all__ as manifest_entries
print(f'Endpoint manifest entries: {len(manifest_entries)}')
assert len(manifest_entries) >= 20, f'Expected >=20 manifest entries, got {len(manifest_entries)}'
print('Tool count check OK')
"

  security-pip-audit:
    runs-on: ubuntu-latest
    needs: mcp-smoke
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit security scan
        run: pip-audit